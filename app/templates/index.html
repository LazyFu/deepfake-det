<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>深度伪造检测演示</title>
<style>
  :root { --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb; --fake:#dc2626; --real:#059669; --bg:#f7f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Noto Sans CJK SC", sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:28px 32px 18px; background:#fff; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 6px; font-size:22px; }
  .sub { color:var(--muted); font-size:13px; }
  main { max-width: 980px; margin: 24px auto 60px; padding: 0 20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:18px; }
  .drop { border:2px dashed #cbd5e1; border-radius:12px; padding:34px; text-align:center; color:var(--muted); }
  .drop.hover { border-color:#2563eb; background:#eff6ff; }
  .btn { display:inline-block; padding:10px 18px; border-radius:8px; border:1px solid #2563eb;
         background:#2563eb; color:#fff; font-size:14px; cursor:pointer; }
  .btn.ghost { background:#fff; color:#2563eb; }
  .row { display:flex; gap:18px; flex-wrap:wrap; }
  .col { flex:1 1 300px; }
  .score { font-size:44px; font-weight:700; margin:0; }
  .badge { display:inline-block; padding:4px 12px; border-radius:999px; color:#fff; font-size:13px; }
  .badge.fake { background:var(--fake); } .badge.real { background:var(--real); }
  .meta { color:var(--muted); font-size:12.5px; line-height:1.9; }
  img { width:100%; border-radius:8px; border:1px solid var(--line); }
  .cap { font-size:12px; color:var(--muted); margin:6px 0 0; text-align:center; }
  .hidden { display:none; }
  code { background:#f1f5f9; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>深度伪造检测 · 可解释分析演示</h1>
  <div class="sub">RGB 基线 · 人脸裁剪 → 伪造概率 → Grad-CAM 热图 → 频谱图 → PDF 审计报告</div>
</header>
<main>
  <div class="card">
    <div id="drop" class="drop">
      <p>拖拽人脸图片到这里，或</p>
      <input id="file" type="file" accept="image/*" style="display:none">
      <label for="file" class="btn">选择图片</label>
      <p class="meta" id="chosen"></p>
    </div>
    <div style="margin-top:16px" class="row">
      <div class="col meta">
        当前模型：<code id="ckpt">{{ ckpt }}</code><br>
        使用阈值：<code>{{ '%.4f'|format(threshold_f1) }}</code>（验证集 F1 最优）<br>
        严格阈值：<code>{{ '%.4f'|format(threshold_strict) }}</code>（验证集 FPR≤1%）
      </div>
      <div class="col" style="text-align:right">
        <button class="btn" id="go" disabled>开始检测</button>
      </div>
    </div>
  </div>

  <div id="result" class="hidden">
    <div class="card">
      <div class="row">
        <div class="col">
          <p class="meta">伪造概率</p>
          <p class="score" id="score">–</p>
          <p><span class="badge" id="verdict">–</span></p>
        </div>
        <div class="col meta" id="details"></div>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <div class="col"><img id="heat"><p class="cap">Grad-CAM：模型关注区域</p></div>
        <div class="col"><img id="spec"><p class="cap">频谱图：log|FFT|</p></div>
      </div>
    </div>
    <div class="card" style="text-align:center">
      <a class="btn ghost" id="pdf" target="_blank">下载 PDF 审计报告</a>
      <span class="meta" id="audit" style="margin-left:14px"></span>
    </div>
  </div>
</main>

<script>
const fileInput = document.getElementById('file');
const drop = document.getElementById('drop');
const go = document.getElementById('go');
const chosen = document.getElementById('chosen');
let current = null;

function pick(f) {
  current = f;
  chosen.textContent = f ? `${f.name}（${(f.size/1024).toFixed(1)} KB）` : '';
  go.disabled = !f;
}
fileInput.addEventListener('change', e => pick(e.target.files[0]));
['dragover','dragenter'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files.length) pick(e.dataTransfer.files[0]); });

go.addEventListener('click', async () => {
  if (!current) return;
  go.disabled = true; go.textContent = '检测中…';
  const fd = new FormData(); fd.append('file', current);
  try {
    const r = await fetch('/v1/detect/image', { method:'POST', body: fd });
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    document.getElementById('result').classList.remove('hidden');
    document.getElementById('score').textContent = (d.score*100).toFixed(2) + '%';
    const v = document.getElementById('verdict');
    v.textContent = d.verdict === 'fake' ? '判定：伪造' : '判定：真实';
    v.className = 'badge ' + d.verdict;
    document.getElementById('heat').src = d.artifacts.heatmap + '?t=' + Date.now();
    document.getElementById('spec').src = d.artifacts.spectrum + '?t=' + Date.now();
    document.getElementById('pdf').href = d.artifacts.pdf;
    document.getElementById('audit').textContent = '审计哈希 ' + d.audit_hash.slice(0, 16) + '…';
    document.getElementById('details').innerHTML =
      `阈值 ${d.threshold.toFixed(4)}（验证集 F1 最优）<br>` +
      `严格阈值 ${d.threshold_strict.toFixed(4)}<br>` +
      `人脸框 ${d.face_box ? d.face_box.join(', ') : '未检测到，使用整图'}<br>` +
      `耗时 ${d.latency_ms} ms · 输入 ${d.input_size[1]}×${d.input_size[0]}`;
  } catch (err) {
    alert('检测失败：' + err.message);
  } finally {
    go.disabled = false; go.textContent = '开始检测';
  }
});
</script>
</body>
</html>
