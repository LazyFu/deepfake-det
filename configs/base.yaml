seed: 42

data:
  image_size: 224
  num_workers: 4

model:
  use_freq: true
  use_gate: true
  pretrained: true
  dropout: 0.3

train:
  epochs: 15
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.0001
  amp: true
  consistency: 0.0
  patience: 4
  degrade_prob: 0.5
  class_weight: true
  out_dir: runs

eval:
  batch_size: 64
